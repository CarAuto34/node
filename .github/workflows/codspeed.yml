name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # for OIDC authentication with CodSpeed

jobs:
  benchmarks:
    name: Run native benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Build benchmarks
        run: |
          cmake -S benchmark/native -B benchmark/native/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCODSPEED_MODE=simulation
          cmake --build benchmark/native/build -j "$(nproc)"
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f  # v5.6.3
        with:
          mode: simulation
          run: benchmark/native/run.sh
